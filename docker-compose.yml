services:
  kafka:
    image: apache/kafka:latest
    ports:
      - 29092:29092
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - 5433:5432
    user: postgres
    environment:
      POSTGRES_DB: credit_scoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_scoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  calculator:
    build:
      context: .
      dockerfile: calculator/Dockerfile
    container_name: calculator
    ports:
      - 8080:8080
    env_file:
      - .env.docker

  deal:
    build:
      context: .
      dockerfile: deal/Dockerfile
    container_name: deal
    ports:
      - 8081:8081
    environment:
      EMAIL_BASE_URL: http://deal:8081
      POSTGRES_DB: credit_scoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_URL: jdbc:postgresql://postgres:5432/credit_scoring
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy

  statement:
    build:
      context: .
      dockerfile: statement/Dockerfile
    container_name: statement
    ports:
      - 8082:8082
    env_file:
      - .env.docker

  dossier:
    build:
      context: .
      dockerfile: dossier/Dockerfile
    container_name: dossier
    ports:
      - 8083:8083
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env.docker
      - ./dossier/.env

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - 8084:8084
    env_file:
      - .env.docker

volumes:
  postgres_data:
